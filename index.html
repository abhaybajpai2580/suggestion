<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Suggestions</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #search-container { max-width: 600px; margin: 0 auto; }
        input { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
        #suggestions-list { border: 1px solid #ccc; max-height: 300px; overflow-y: auto; list-style-type: none; padding: 0; margin: 0; }
        #suggestions-list li { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        #suggestions-list li:hover { background-color: #f0f0f0; }
        .count { font-size: 0.8em; color: #666; margin-top: 5px; text-align: right; }
    </style>
</head>
<body>
    <div id="search-container">
        <h1>Search Suggestions</h1>
        <input type="text" id="search-input" placeholder="Type to search...">
        <div id="suggestion-count" class="count"></div>
        <ul id="suggestions-list"></ul>
    </div>
    <script src="suggestion.js"></script>
    <script>
        const searchInput = document.getElementById('search-input');
        const suggestionsList = document.getElementById('suggestions-list');
        const countDisplay = document.getElementById('suggestion-count');

        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase();
            suggestionsList.innerHTML = '';
            countDisplay.textContent = '';

            if (query.length === 0) {
                return;
            }

            const suggestions = window.searchSuggestions || [];
            const filtered = suggestions.filter(item => item.toLowerCase().includes(query));

            countDisplay.textContent = `Found ${filtered.length} suggestions`;

            // Display up to 100 suggestions
            filtered.slice(0, 100).forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                li.addEventListener('click', () => {
                    searchInput.value = item;
                    suggestionsList.innerHTML = '';
                    countDisplay.textContent = '';
                });
                suggestionsList.appendChild(li);
            });
        });

        // Initialize display of total suggestions count
        if (window.searchSuggestions) {
             countDisplay.textContent = `Total available suggestions: ${window.searchSuggestions.length}`;
        }
    </script>
</body>
</html>
